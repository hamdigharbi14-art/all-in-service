<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ALL IN SERVICE : nettoyage, jardinage, maintenance et piscines pour particuliers et entreprises dans toute la Tunisie."><title>ALL IN SERVICE | Facility Management en Tunisie</title><style>
:root{--navy:#07366b;--blue:#087fd0;--light:#eaf6ff;--ink:#183047;--muted:#61788d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.65;background:white}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(12px);box-shadow:0 2px 16px #092e5614}.nav{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:20px}.brand{display:flex;align-items:center;gap:12px;color:var(--navy);font-weight:900;font-size:19px;line-height:1.1}.brand img{width:105px;height:72px;object-fit:contain}.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--blue)}nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}nav a{font-size:14px;font-weight:700}nav a:hover,.active{color:var(--blue)}.btn{display:inline-block;background:var(--blue);color:white;border:0;border-radius:9px;padding:13px 22px;font-weight:700;cursor:pointer}.btn:hover{background:var(--navy)}.btn.outline{background:transparent;color:var(--navy);border:2px solid var(--navy)}.hero{background:linear-gradient(110deg,#07366be9,#0867b3c9),url('assets/hero.jpg') center/cover;min-height:550px;color:white;display:flex;align-items:center}.wrap{max-width:1180px;margin:auto;padding:0 22px}.hero .wrap{width:100%}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-weight:bold;font-size:12px;color:#a9ddff}h1{font-size:clamp(38px,5.2vw,68px);line-height:1.12;max-width:820px;margin:14px 0 20px}h2{font-size:clamp(27px,3vw,40px);line-height:1.2;color:var(--navy);margin:10px 0 20px}h3{color:var(--navy);margin:10px 0}.hero p{font-size:19px;max-width:680px}.hero .btn{background:white;color:var(--navy);margin:14px 10px 0 0}.hero .btn.outline{background:transparent;color:white;border-color:white}section{padding:80px 0}.center{text-align:center}.lead{font-size:18px;color:var(--muted);max-width:780px}.center .lead{margin:0 auto 35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:white;border:1px solid #e1eaf2;border-radius:18px;padding:30px;box-shadow:0 12px 32px #0c41700d;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-7px);box-shadow:0 16px 35px #0c41701c}.ico{font-size:34px;background:var(--light);border-radius:15px;width:64px;height:64px;display:grid;place-items:center;margin-bottom:18px}.card p{color:var(--muted)}.card a{font-weight:bold;color:var(--blue)}.pale{background:#f4f9fd}.split{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.panel{background:linear-gradient(135deg,#d8efff,#f4fbff);border-radius:25px;padding:45px}.checks{padding-left:20px}.checks li{padding:6px 0}.banner{background:var(--navy);color:white;text-align:center}.banner h2{color:white}.pagehero{background:linear-gradient(120deg,#07366b,#0b83d0);color:white;padding:75px 0}.pagehero h1{font-size:clamp(34px,5vw,55px)}.pagehero p{max-width:750px;font-size:19px}.service-detail{max-width:850px}.service-detail h2{margin-top:35px}.service-detail li{margin:10px 0}.contact-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:36px}form{display:grid;gap:15px}label{font-size:14px;font-weight:bold;color:var(--navy)}input,select,textarea{width:100%;margin-top:6px;padding:13px;border:1px solid #c8d8e6;border-radius:8px;font:inherit}textarea{min-height:125px;resize:vertical}.notice{font-size:13px;color:var(--muted)}footer{background:#062b51;color:#d8e9f7;padding:38px 0}footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer a{color:#fff}.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}.reveal.visible{opacity:1;transform:none}.menu{display:none;background:none;border:0;font-size:28px;color:var(--navy)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.split,.contact-grid{grid-template-columns:1fr}.menu{display:block}nav{display:none;position:absolute;top:96px;left:0;right:0;background:white;padding:20px;box-shadow:0 10px 20px #1233;flex-direction:column;align-items:flex-start}nav.open{display:flex}.hero{min-height:480px}}@media(max-width:560px){.grid{grid-template-columns:1fr}section{padding:55px 0}.hero p{font-size:17px}.brand{font-size:16px}.brand img{width:82px;height:60px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}

/* V3: illustrations HED, responsive image cards and subtle motion */
.hero{background-image:linear-gradient(110deg,#07366bf0,#0867b3a0),url("https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/06/29061.jpg?ssl=1&w=1200")}.card{padding:0;overflow:hidden}.card .card-body{padding:25px 28px 30px}.card-photo{display:block;width:100%;height:205px;object-fit:cover;transition:transform .6s ease}.card:hover .card-photo{transform:scale(1.045)}.photo-frame{width:100%;min-height:280px;max-height:430px;object-fit:cover;border-radius:22px;box-shadow:0 18px 42px #0c417025}.service-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:25px 0 40px}.service-gallery img{width:100%;height:245px;object-fit:cover;border-radius:14px}.credit{font-size:12px;color:#61788d}.gallery-head{margin-top:28px}.photo-caption{font-size:13px;color:#61788d;margin-top:8px}.hero .eyebrow{color:#b7e7ff}@media(max-width:700px){.service-gallery{grid-template-columns:1fr}.service-gallery img{height:220px}.card-photo{height:200px}}@media(prefers-reduced-motion:reduce){.card-photo{transition:none}}
</style></head><body>
<header><div class="nav"><a href="#/" class="brand"><img src="assets/logo.png" alt="Logo ALL IN SERVICE"><span>ALL IN SERVICE<small>FACILITY MANAGEMENT</small></span></a><button class="menu" aria-label="Ouvrir le menu" aria-expanded="false" onclick="toggleMenu(this)">☰</button><nav id="navigation"><a href="#/">Accueil</a><a href="#/nettoyage">Nettoyage</a><a href="#/solaire">Panneaux solaires</a><a href="#/jardinage">Jardinage</a><a href="#/maintenance">Maintenance</a><a href="#/piscines">Piscines</a><a href="#/contact" class="btn">Demander un devis</a></nav></div></header>
<main id="app"></main><footer><div class="wrap"><div><strong>ALL IN SERVICE</strong><br>Facility Management · Toute la Tunisie</div><div>Nettoyage · Solaire · Jardinage · Maintenance · Piscines</div><div><a href="#/contact">Nous contacter</a></div></div></footer>
<script>
const services=[{slug:'nettoyage',photo:'https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/06/29061.jpg?ssl=1&w=1200',icon:'✨',title:'Nettoyage professionnel',intro:'Des espaces propres et accueillants, y compris vos panneaux solaires, au quotidien comme après un chantier.',details:'ALL IN SERVICE accompagne les particuliers et les entreprises dans l’entretien de leurs espaces. Nous proposons des interventions régulières ou ponctuelles, adaptées aux besoins et à la nature de chaque lieu.',items:['Nettoyage de maisons, villas et appartements','Entretien d’immeubles, bureaux et locaux professionnels','Prestations régulières ou occasionnelles','Nettoyage approfondi après construction ou rénovation','Nettoyage des terrasses, cours et zones extérieures','Nettoyage et entretien courant des panneaux solaires photovoltaïques (élimination de poussière, sable et salissures avec méthodes adaptées)']},{slug:'solaire',photo:'https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/07/11182.jpg?ssl=1&w=1200',icon:'☀️',title:'Nettoyage de panneaux solaires',intro:'Entretien adapté des installations photovoltaïques.',details:'Nettoyage soigneux des panneaux pour retirer poussière, sable et dépôts, avec des méthodes adaptées aux surfaces.',items:['Nettoyage de panneaux photovoltaïques','Élimination des poussières et salissures','Interventions ponctuelles ou programmées']},{slug:'jardinage',photo:'https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/07/rasemaeher4.jpg?ssl=1&w=1200',icon:'🌿',title:'Jardinage et espaces verts',intro:'Un environnement extérieur entretenu, agréable et valorisé.',details:'Nous prenons soin de vos jardins et espaces verts grâce à des interventions adaptées à la saison, à la taille de votre terrain et à vos attentes.',items:['Entretien courant des jardins et pelouses','Tonte et désherbage','Taille de haies et d’arbustes','Ramassage des feuilles et déchets verts','Nettoyage et remise en état des espaces verts']},{slug:'maintenance',photo:'https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/07/Handwerker.jpg?ssl=1&w=1200',icon:'🛠️',title:'Maintenance et dépannage',intro:'Des solutions pratiques pour les petits travaux et les réparations du quotidien.',details:'Notre offre de maintenance vise à simplifier la gestion de vos biens immobiliers. Pour une habitation, un bureau ou un local professionnel, nous intervenons sur les besoins courants de fixation, de bricolage et de dépannage.',items:['Fixation d’étagères et d’accessoires','Petits travaux de bricolage et réparations','Dépannage rapide selon disponibilité','Petite plomberie : robinetterie, fuites simples et raccords','Entretien courant des équipements et installations']},{slug:'piscines',photo:'',icon:'💧',title:'Piscines et traitement de l’eau',intro:'Une piscine propre et une eau entretenue, selon vos besoins.',details:'ALL IN SERVICE propose, sur demande, des prestations de nettoyage de piscines et d’entretien de l’eau, en fonction de l’état des installations et de la fréquence souhaitée.',items:['Nettoyage des bassins et des abords','Retrait des feuilles et impuretés','Nettoyage courant des équipements accessibles','Contrôle et traitement de l’eau sur demande','Interventions ponctuelles ou programmes d’entretien à définir']}];
const card=s=>`<article class="card reveal">${s.photo?`<img class="card-photo" src="${s.photo}" loading="lazy" alt="Illustration : ${s.title}">`:`<div class="card-photo" style="background:linear-gradient(135deg,#d6f5ff,#168bc2);display:grid;place-items:center;font-size:75px" aria-label="Piscines">💧</div>`}<div class="card-body"><div class="ico">${s.icon}</div><h3>${s.title}</h3><p>${s.intro}</p><a href="#/${s.slug}">Découvrir le service →</a></div></article>`;
function home(){return `<div class="hero"><div class="wrap"><div class="eyebrow">Facility Management · Tunisie</div><h1>Un seul partenaire.<br>Tous vos services.</h1><p>Nettoyage, entretien de panneaux solaires, jardinage, maintenance et piscines pour les particuliers et les entreprises dans toute la Tunisie.</p><a class="btn" href="#/contact">Demander un devis</a><a class="btn outline" href="#services">Nos prestations</a></div></div><section id="services"><div class="wrap"><div class="center reveal"><div class="eyebrow" style="color:#087fd0">Notre savoir-faire</div><h2>Des services pour chaque besoin</h2><p class="lead">Un interlocuteur unique pour entretenir, préserver et valoriser vos espaces.</p></div><div class="grid">${services.map(card).join('')}</div></div></section><section class="pale"><div class="wrap split"><div class="reveal"><img class="photo-frame" src="https://i0.wp.com/hed-dienstleistungen.de/wp-content/uploads/2026/06/54434.jpg?ssl=1&w=1200" loading="lazy" alt="Entretien professionnel de bureaux"><h2>Vos espaces, notre priorité.</h2><p>Maisons, villas, immeubles, bureaux et espaces extérieurs.</p></div><div class="reveal"><div class="eyebrow" style="color:#087fd0">Pourquoi nous choisir ?</div><h2>Une solution simple et polyvalente</h2><p class="lead">Que vous soyez particulier ou professionnel, nous étudions vos besoins pour proposer une prestation adaptée.</p><ul class="checks"><li>Un point de contact pour plusieurs métiers</li><li>Prestations ponctuelles ou régulières</li><li>Services pour particuliers et entreprises</li><li>Zone d’intervention : toute la Tunisie, selon disponibilité</li></ul><a class="btn" href="#/contact">Parlons de votre projet</a></div></div></section><section class="banner"><div class="wrap reveal"><h2>Besoin d'une intervention ?</h2><p>Décrivez votre besoin et demandez un devis personnalisé.</p><a href="#/contact" class="btn" style="background:white;color:#07366b">Nous contacter</a></div></section>`}
function servicePage(s){return `<div class="pagehero"><div class="wrap"><div class="eyebrow">Nos services</div><h1>${s.icon} ${s.title}</h1><p>${s.intro}</p></div></div><section><div class="wrap service-detail reveal">${s.photo?`<img class="photo-frame" src="${s.photo}" alt="${s.title}">`:``}<h2>Notre prestation</h2><p class="lead">${s.details}</p><h2>Ce que nous proposons</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul><p>Chaque demande est étudiée selon le lieu, la fréquence souhaitée et les travaux à réaliser.</p><a class="btn" href="#/contact">Demander un devis pour ce service</a></div></section><section class="pale"><div class="wrap"><h2>Découvrez aussi nos autres services</h2><div class="grid">${services.filter(x=>x.slug!==s.slug).map(card).join('')}</div></div></section>`}
function contact(){return `<div class="pagehero"><div class="wrap"><div class="eyebrow">Contact</div><h1>Parlons de votre besoin</h1><p>Particuliers et entreprises, contactez-nous pour une intervention dans toute la Tunisie.</p></div></div><section><div class="wrap contact-grid"><div class="reveal"><h2>Demander un devis</h2><p>Complétez le formulaire. Votre application de messagerie s’ouvrira avec un email prérempli.</p><form id="contactForm"><label>Nom et prénom / Entreprise *<input name="nom" required maxlength="100"></label><label>Adresse email *<input type="email" name="email" required></label><label>Téléphone *<input type="tel" name="tel" required></label><label>Ville / Gouvernorat *<input name="ville" required></label><label>Service souhaité *<select name="service" required><option value="">Choisissez un service</option>${services.map(s=>`<option>${s.title}</option>`).join('')}</select></label><label>Votre demande *<textarea name="message" required maxlength="3000"></textarea></label><button class="btn" type="submit">Préparer mon email</button><div class="notice" role="status" id="formStatus">Version de démonstration : l’envoi automatique sera activé après création de l’email professionnel et configuration du serveur.</div></form></div><aside class="panel reveal"><h2>ALL IN SERVICE</h2><p><strong>Zone d’intervention</strong><br>Toute la Tunisie</p><p><strong>Pour qui ?</strong><br>Particuliers et entreprises</p><p><strong>Prestations</strong><br>Nettoyage, jardinage, maintenance et piscines</p><p class="notice">Adresse email professionnelle et numéro de téléphone à ajouter avant la mise en ligne.</p></aside></div></section>`}
function render(){const path=decodeURIComponent(location.hash.replace(/^#\/?/,'').split('?')[0]);const s=services.find(x=>x.slug===path);document.getElementById('app').innerHTML=s?servicePage(s):path==='contact'?contact():home();document.title=(s?s.title:path==='contact'?'Contact':'Accueil')+' | ALL IN SERVICE';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+path));document.getElementById('navigation').classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));const f=document.getElementById('contactForm');if(f)f.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(f);const body=[...d.entries()].map(([k,v])=>k+': '+v).join('\n');document.getElementById('formStatus').textContent='Votre messagerie va s’ouvrir. Vérifiez le destinataire avant d’envoyer : l’adresse définitive n’est pas encore configurée.';window.location.href='mailto:?subject='+encodeURIComponent('Demande de devis ALL IN SERVICE')+'&body='+encodeURIComponent(body)})}
function toggleMenu(b){const n=document.getElementById('navigation');n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open'))}window.addEventListener('hashchange',render);render();
</script></body></html>
